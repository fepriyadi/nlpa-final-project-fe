  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

iv class=\"grid grid-cols-2 gap-3\">\n        <div>\n          <label class=\"block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1.5\">Produk <span class=\"text-slate-300 normal-case font-normal\">(opsional)<\u002Fspan><\u002Flabel>\n          <input name=\"product\" type=\"text\" placeholder=\"cth: Serum X 30ml\" class=\"w-full h-9 px-3 text-[13px] border border-slate-200 rounded-md focus:outline-none focus:border-blue-500\">\n        <\u002Fdiv>\n        <div>\n          <label class=\"block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1.5\">Tanggal <span class=\"text-slate-300 normal-case font-normal\">(opsional)<\u002Fspan><\u002Flabel>\n          <input name=\"date\" type=\"date\" class=\"w-full h-9 px-3 text-[13px] border border-slate-200 rounded-md focus:outline-none focus:border-blue-500\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fform>\n    <div class=\"px-5 py-3 bg-slate-50 border-t border-slate-100 rounded-b-xl flex items-center justify-end gap-2\">\n      <button data-close=\"\" class=\"h-9 px-3.5 text-[13px] rounded-md text-slate-600 hover:bg-slate-100\">Batal<\u002Fbutton>\n      <button id=\"submitAdd\" class=\"h-9 px-3.5 text-[13px] rounded-md bg-slate-900 hover:bg-slate-800 text-white font-medium inline-flex items-center gap-1.5\">\n        <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" stroke-width=\"2\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>\n        Tambah &amp; Analisis\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ====================== Detail Drawer ====================== -->\n<div id=\"drawer\" class=\"hidden fixed inset-0 z-40 bg-slate-900/40 flex justify-end\">\n  <div class=\"bg-white w-full max-w-md h-full overflow-auto scroll-thin border-l border-slate-200 shadow-2xl\">\n    <div class=\"px-5 py-3.5 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white\">\n      <div class=\"text-[14px] font-bold text-slate-900\">Detail Review<\u002Fdiv>\n      <button data-close-drawer=\"\" class=\"w-7 h-7 inline-flex items-center justify-center rounded-md text-slate-400 hover:bg-slate-100\">\n        <svg class=\"w-4 h-4\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" stroke-width=\"2\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M6 18L18 6M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"p-5 space-y-4\" id=\"drawerBody\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ====================== Toast ====================== -->\n<div id=\"toast\" class=\"hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-[12.5px] px-4 py-2.5 rounded-md shadow-xl\"><\u002Fdiv>\n\n<script>\n/* ----------------- Mock classifier ----------------- */\n// Heuristic-only; just to make the prototype feel alive. Not real ML.\nconst fakeMarkers = [\n  \"mantap\", \"joss\", \"recommended seller\", \"barang ori\", \"pengiriman cepat\",\n  \"the best\", \"no tipu\", \"amazing\", \"wajib beli\", \"kerennn\", \"5 bintang\",\n  \"tidak mengecewakan\", \"produk istimewa\", \"fast respon\", \"kualitas premium\"\n];\n\nfunction classify(text, rating) {\n  const t = (text||\"\").toLowerCase();\n  const len = t.replace(/\\s+/g, \" \").trim().length;\n  let score = 0;\n  // very short + high rating = suspicious\n  if (rating >= 5 && len < 25) score += 0.45;\n  if (rating >= 5 && len < 60) score += 0.15;\n  // marker words\n  let hits = 0;\n  fakeMarkers.forEach(m => { if (t.includes(m)) hits++; });\n  score += Math.min(0.4, hits * 0.12);\n  // many exclamations\n  const ex = (t.match(/!/g)||[]).length;\n  if (ex >= 3) score += 0.1;\n  // repeated chars (mantappp, baguss)\n  if (/(\\w)\\1{2,}/.test(t)) score += 0.08;\n  // contradiction: low rating with overly positive markers\n  if (rating <= 2 && hits >= 1) score += 0.2;\n  // long detailed review with specific nouns = likely genuine\n  if (len > 140) score -= 0.2;\n  if (/(setelah|pemakaian|hari|minggu|bulan|sebelumnya|dibanding)/i.test(t)) score -= 0.12;\n\n  score = Math.max(0.02, Math.min(0.98, score + 0.05));\n\n  let label, conf;\n  if (score >= 0.65)      { label = \"fake\";       conf = score; }\n  else if (score >= 0.4)  { label = \"suspicious\"; conf = 1 - Math.abs(0.5 - score); }\n  else                    { label = \"genuine\";    conf = 1 - score; }\n  return { label, confidence: Math.round(conf * 1000) / 10 };\n}\n\nfunction suggestionFor(label, rating, text) {\n  if (label === \"fake\") return \"Tandai & sembunyikan dari listing; tinjau riwayat akun.\";\n  if (label === \"suspicious\") return \"Minta verifikasi pembelian; pantau review lain dari user yang sama.\";\n  if (rating <= 2) return \"Eskalasi ke tim CS untuk follow-up keluhan.\";\n  return \"Tampilkan normal; review terlihat otentik.\";\n}\n\n/* ----------------- Seed data ----------------- */\nlet reviews = [\n  { id: 1, username: \"siti_amelia\",     rating: 5, text: \"Saya pakai serum ini selama 3 minggu, tekstur kulit jelas lebih halus dan jerawat hormonal di dagu berkurang. Awalnya sempat purging 4 hari. Packaging aman, dikirim cepat.\", product: \"Serum Niacinamide 30ml\", date: \"2026-05-30\" },\n  { id: 2, username: \"user1281xx\",      rating: 5, text: \"Mantap! Recommended seller, barang ori, pengiriman cepat. 5 bintang!!!\", product: \"Serum Niacinamide 30ml\", date: \"2026-05-31\" },\n  { id: 3, username: \"rinaa.k\",         rating: 4, text: \"Produk oke, di kulit kombinasi saya cukup melembabkan tapi agak lengket di awal. Setelah 30 menit menyerap. Harga sesuai.\", product: \"Moisturizer Gel 50ml\", date: \"2026-05-31\" },\n  { id: 4, username: \"promotor.id_99\",  rating: 5, text: \"WAJIB BELI!!! The best produk istimewa kualitas premium fast respon!!!!\", product: \"Sunscreen SPF50 50ml\", date: \"2026-06-01\" },\n  { id: 5, username: \"dimas.w\",         rating: 2, text: \"Botolnya bocor sedikit waktu sampai. Krimnya sendiri lumayan tapi packaging perlu diperbaiki, sayang aja kalau begini terus.\", product: \"Moisturizer Gel 50ml\", date: \"2026-06-01\" },\n  { id: 6, username: \"akun.baru_2026\",  rating: 5, text: \"Joss kerennn\", product: \"Sunscreen SPF50 50ml\", date: \"2026-06-02\" },\n  { id: 7, username: \"naufalp\",         rating: 4, text: \"Dibanding sunscreen sebelumnya yang white cast, ini jauh lebih nyaman dipakai di bawah makeup. Tidak perih di mata.\", product: \"Sunscreen SPF50 50ml\", date: \"2026-06-02\" },\n  { id: 8, username: \"anonim_xyz\",      rating: 1, text: \"Mantap! barang ori, fast respon. Pokoknya the best.\", product: \"Toner 100ml\", date: \"2026-06-02\" },\n];\nlet nextId = 9;\nlet currentFilter = \"all\";\nlet searchQ = \"\";\n\n/* ----------------- Render ----------------- */\nconst tbody = document.getElementById(\"tbody\");\nconst emptyState = document.getElementById(\"emptyState\");\n\nfunction badge(label) {\n  if (label === \"fake\")\n    return `<span class=\"inline-flex items-center gap-1 bg-rose-50 text-rose-700 text-[11px] font-semibold px-1.5 py-0.5 rounded\">\n      <span class=\"w-1.5 h-1.5 rounded-full bg-rose-500\"><\u002Fspan>Fake<\u002Fspan>`;\n  if (label === \"suspicious\")\n    return `<span class=\"inline-flex items-center gap-1 bg-amber-50 text-amber-700 text-[11px] font-semibold px-1.5 py-0.5 rounded\">\n      <span class=\"w-1.5 h-1.5 rounded-full bg-amber-500\"><\u002Fspan>Suspicious<\u002Fspan>`;\n  return `<span class=\"inline-flex items-center gap-1 bg-emerald-50 text-emerald-700 text-[11px] font-semibold px-1.5 py-0.5 rounded\">\n    <span class=\"w-1.5 h-1.5 rounded-full bg-emerald-500\"><\u002Fspan>Genuine<\u002Fspan>`;\n}\n\nfunction stars(n) {\n  let s = \"\";\n  for (let i = 1; i <= 5; i++) {\n    s += `<span class=\"${i<=n?'text-amber-400':'text-slate-200'} text-[12px]\">★<\u002Fspan>`;\n  }\n  return `<span class=\"inline-flex items-center gap-0.5\">${s}<span class=\"ml-1 text-[11.5px] text-slate-500 tabular-nums\">${n}.0<\u002Fspan><\u002Fspan>`;\n}\n\nfunction avatar(name) {\n  const initials = name.slice(0,2).toUpperCase();\n  const palette = [\"bg-blue-100 text-blue-700\",\"bg-emerald-100 text-emerald-700\",\"bg-amber-100 text-amber-700\",\"bg-rose-100 text-rose-700\",\"bg-purple-100 text-purple-700\",\"bg-slate-100 text-slate-600\"];\n  const hash = [...name].reduce((a,c)=>a + c.charCodeAt(0),0);\n  const cls = palette[hash % palette.length];\n  return `<span class=\"w-7 h-7 rounded-full ${cls} text-[11px] font-bold inline-flex items-center justify-center\">${initials}<\u002Fspan>`;\n}\n\nfunction render() {\n  const list = reviews.map(r => ({...r, ...classify(r.text, r.rating)}));\n  const filtered = list.filter(r => {\n    if (currentFilter !== \"all\" && r.label !== currentFilter) return false;\n    if (searchQ) {\n      const q = searchQ.toLowerCase();\n      if (!(r.username.toLowerCase().includes(q) || r.text.toLowerCase().includes(q) || (r.product||\"\").toLowerCase().includes(q))) return false;\n    }\n    return true;\n  });\n\n  // summary\n  const total = list.length;\n  const genuine = list.filter(r=>r.label===\"genuine\").length;\n  const fake = list.filter(r=>r.label!==\"genuine\").length;\n  const avgConf = list.length ? (list.reduce((a,r)=>a+r.confidence,0)/list.length) : 0;\n  const setK = (k,v)=>{ const el = document.querySelector(`[data-k=\"${k}\"]`); if(el) el.textContent = v; };\n  setK(\"total\", total);\n  setK(\"genuine\", genuine);\n  setK(\"fake\", fake);\n  setK(\"genuinePct\", total ? (genuine*100/total).toFixed(1).replace(\".\",\",\")+\"%\" : \"0%\");\n  setK(\"fakePct\", total ? (fake*100/total).toFixed(1).replace(\".\",\",\")+\"%\" : \"0%\");\n  setK(\"avgConf\", avgConf.toFixed(1).replace(\".\",\",\")+\"%\");\n  document.getElementById(\"totalCount\").textContent = total;\n  document.getElementById(\"visibleCount\").textContent = filtered.length;\n\n  // table\n  tbody.innerHTML = filtered.map((r, idx) => {\n    const sug = suggestionFor(r.label, r.rating, r.text);\n    const confBarColor = r.label===\"fake\" ? \"bg-rose-500\" : r.label===\"suspicious\" ? \"bg-amber-500\" : \"bg-emerald-500\";\n    return `<tr class=\"border-b border-slate-100 hover:bg-slate-50/70 cursor-pointer\" data-id=\"${r.id}\">\n      <td class=\"px-3.5 py-3 text-[11.5px] tabular-nums text-slate-400\">${String(idx+1).padStart(2,\"0\")}<\u002Ftd>\n      <td class=\"px-3.5 py-3\">\n        <div class=\"flex items-center gap-2 min-w-0\">\n          ${avatar(r.username)}\n          <div class=\"min-w-0\">\n            <div class=\"text-[12.5px] font-medium text-slate-900 truncate\">${r.username}<\u002Fdiv>\n            <div class=\"text-[10.5px] text-slate-400 truncate\">${r.product||\"\"}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Ftd>\n      <td class=\"px-3.5 py-3\">${stars(r.rating)}<\u002Ftd>\n      <td class=\"px-3.5 py-3 max-w-md\">\n        <div class=\"text-[12.5px] text-slate-700 line-clamp-2\">${escapeHtml(r.text)}<\u002Fdiv>\n        <div class=\"text-[10.5px] text-slate-400 mt-0.5 tabular-nums\">${r.date||\"\"}<\u002Fdiv>\n      <\u002Ftd>\n      <td class=\"px-3.5 py-3\">${badge(r.label)}<\u002Ftd>\n      <td class=\"px-3.5 py-3 text-right\">\n        <div class=\"inline-flex flex-col items-end gap-1\">\n          <span class=\"text-[12.5px] font-semibold tabular-nums text-slate-900\">${r.confidence.toFixed(1).replace(\".\",\",\")}%<\u002Fspan>\n          <div class=\"w-20 h-1 rounded-full bg-slate-100 overflow-hidden\">\n            <div class=\"h-full ${confBarColor}\" style=\"width:${r.confidence}%\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Ftd>\n      <td class=\"px-3.5 py-3 text-[12px] text-slate-600 max-w-xs\">${sug}<\u002Ftd>\n      <td class=\"px-3.5 py-3 text-right\">\n        <button class=\"row-del w-7 h-7 inline-flex items-center justify-center rounded-md text-slate-400 hover:bg-rose-50 hover:text-rose-600\" data-del=\"${r.id}\" title=\"Hapus\">\n          <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" stroke-width=\"2\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6\"/><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Ftd>\n    <\u002Ftr>`;\n  }).join(\"\");\n  emptyState.classList.toggle(\"hidden\", filtered.length > 0);\n\n  // wire row events\n  tbody.querySelectorAll(\"tr[data-id]\").forEach(tr => {\n    tr.addEventListener(\"click\", (e) => {\n      if (e.target.closest(\"[data-del]\")) return;\n      openDrawer(parseInt(tr.dataset.id));\n    });\n  });\n  tbody.querySelectorAll(\"[data-del]\").forEach(btn => {\n    btn.addEventListener(\"click\", (e) => {\n      e.stopPropagation();\n      const id = parseInt(btn.dataset.del);\n      reviews = reviews.filter(r => r.id !== id);\n      toast(\"Review dihapus\");\n      render();\n    });\n  });\n}\n\nfunction escapeHtml(s){ return (s||\"\").replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\n/* ----------------- Drawer ----------------- */\nfunction openDrawer(id) {\n  const r = reviews.find(x => x.id === id); if (!r) return;\n  const c = classify(r.text, r.rating);\n  const sug = suggestionFor(c.label, r.rating, r.text);\n  const body = document.getElementById(\"drawerBody\");\n  body.innerHTML = `\n    <div class=\"flex items-start gap-3 pb-3 border-b border-slate-100\">\n      ${avatar(r.username).replace(\"w-7 h-7\",\"w-10 h-10\").replace(\"text-[11px]\",\"text-[13px]\")}\n      <div class=\"min-w-0 flex-1\">\n        <div class=\"text-[13.5px] font-bold text-slate-900\">${r.username}<\u002Fdiv>\n        <div class=\"text-[11.5px] text-slate-500\">${r.product||\"—\"} · ${r.date||\"—\"}<\u002Fdiv>\n        <div class=\"mt-1.5\">${stars(r.rating)}<\u002Fdiv>\n      <\u002Fdiv>\n      ${badge(c.label)}\n    <\u002Fdiv>\n\n    <div>\n      <div class=\"text-[10.5px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5\">Isi Review<\u002Fdiv>\n      <div class=\"text-[13px] text-slate-800 leading-relaxed bg-slate-50 border border-slate-100 rounded-lg p-3\">${escapeHtml(r.text)}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"grid grid-cols-2 gap-3\">\n      <div class=\"border border-slate-200 rounded-lg p-3\">\n        <div class=\"text-[10.5px] font-semibold text-slate-400 uppercase tracking-wider mb-1\">Confidence<\u002Fdiv>\n        <div class=\"text-[20px] font-bold tabular-nums text-slate-900\">${c.confidence.toFixed(1).replace(\".\",\",\")}%<\u002Fdiv>\n        <div class=\"h-1.5 mt-1.5 rounded-full bg-slate-100 overflow-hidden\">\n          <div class=\"h-full ${c.label==='fake'?'bg-rose-500':c.label==='suspicious'?'bg-amber-500':'bg-emerald-500'}\" style=\"width:${c.confidence}%\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"border border-slate-200 rounded-lg p-3\">\n        <div class=\"text-[10.5px] font-semibold text-slate-400 uppercase tracking-wider mb-1\">Panjang Teks<\u002Fdiv>\n        <div class=\"text-[20px] font-bold tabular-nums text-slate-900\">${r.text.length}<\u002Fdiv>\n        <div class=\"text-[11px] text-slate-500 mt-0.5\">${r.text.trim().split(/\\s+/).length} kata<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div class=\"text-[10.5px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5\">Saran Tindakan<\u002Fdiv>\n      <div class=\"text-[12.5px] text-slate-700 bg-emerald-50 border border-emerald-100 rounded-lg p-3 leading-relaxed\">${sug}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"flex items-center gap-2 pt-2\">\n      <button class=\"h-9 flex-1 text-[13px] rounded-md border border-slate-200 hover:bg-slate-50 text-slate-700\">Tandai Genuine<\u002Fbutton>\n      <button class=\"h-9 flex-1 text-[13px] rounded-md bg-rose-600 hover:bg-rose-700 text-white font-medium\">Tandai Fake<\u002Fbutton>\n    <\u002Fdiv>\n  `;\n  document.getElementById(\"drawer\").classList.remove(\"hidden\");\n}\ndocument.querySelectorAll(\"[data-close-drawer]\").forEach(b => b.addEventListener(\"click\", () => document.getElementById(\"drawer\").classList.add(\"hidden\")));\ndocument.getElementById(\"drawer\").addEventListener(\"click\", e => { if (e.target.id === \"drawer\") e.currentTarget.classList.add(\"hidden\"); });\n\n/* ----------------- Add modal ----------------- */\nconst modal = document.getElementById(\"modalAdd\");\nconst addForm = document.getElementById(\"addForm\");\ndocument.getElementById(\"btnAdd\").addEventListener(\"click\", () => { modal.classList.remove(\"hidden\"); resetForm(); });\ndocument.querySelectorAll(\"[data-close]\").forEach(b => b.addEventListener(\"click\", () => modal.classList.add(\"hidden\")));\nmodal.addEventListener(\"click\", e => { if (e.target.id === \"modalAdd\") modal.classList.add(\"hidden\"); });\n\nconst ratingLabels = [\"\",\"Sangat buruk\",\"Buruk\",\"Cukup\",\"Baik\",\"Sangat baik\"];\ndocument.querySelectorAll(\".rate\").forEach(btn => {\n  btn.addEventListener(\"click\", () => {\n    const r = parseInt(btn.dataset.r);\n    document.getElementById(\"ratingInput\").value = r;\n    document.getElementById(\"ratingLabel\").textContent = `${r} dari 5 — ${ratingLabels[r]}`;\n    document.querySelectorAll(\".rate\").forEach(b => {\n      const i = parseInt(b.dataset.r);\n      b.classList.toggle(\"text-amber-400\", i <= r);\n      b.classList.toggle(\"border-amber-300\", i <= r);\n      b.classList.toggle(\"bg-amber-50\", i <= r);\n      b.classList.toggle(\"text-slate-400\", i > r);\n    });\n  });\n});\naddForm.querySelector(\"textarea[name=text]\").addEventListener(\"input\", e => {\n  document.getElementById(\"charCount\").textContent = e.target.value.length;\n});\n\nfunction resetForm() {\n  addForm.reset();\n  document.getElementById(\"ratingInput\").value = \"\";\n  document.getElementById(\"ratingLabel\").textContent = \"Belum dipilih\";\n  document.getElementById(\"charCount\").textContent = \"0\";\n  document.querySelectorAll(\".rate\").forEach(b => {\n    b.classList.remove(\"text-amber-400\",\"border-amber-300\",\"bg-amber-50\");\n    b.classList.add(\"text-slate-400\");\n  });\n}\n\ndocument.getElementById(\"submitAdd\").addEventListener(\"click\", () => {\n  const fd = new FormData(addForm);\n  const text = (fd.get(\"text\")||\"\").toString().trim();\n  const rating = parseInt(fd.get(\"rating\")||\"0\");\n  const username = (fd.get(\"username\")||\"\").toString().trim();\n  if (!username) return toast(\"Username wajib diisi\");\n  if (!rating)   return toast(\"Pilih rating\");\n  if (text.length < 5) return toast(\"Isi review terlalu pendek\");\n  reviews.unshift({\n    id: nextId++,\n    username, rating, text,\n    product: (fd.get(\"product\")||\"\").toString().trim() || \"—\",\n    date:    (fd.get(\"date\")||\"\").toString() || new Date().toISOString().slice(0,10),\n  });\n  modal.classList.add(\"hidden\");\n  toast(\"Review ditambahkan & dianalisis\");\n  render();\n});\n\n/* ----------------- CSV: template + upload ----------------- */\ndocument.getElementById(\"btnTemplate\").addEventListener(\"click\", () => {\n  const csv = [\n    \"username,rating,review_text,product,date\",\n    'budi_ganteng21,5,\"Pengiriman cepat dan produk sesuai gambar, sudah pakai 2 minggu hasilnya bagus\",\"Serum X 30ml\",2026-06-01',\n    'user_anonim,5,\"Mantap! Recommended! Barang ori!!\",\"Serum X 30ml\",2026-06-02',\n    'sari.r,3,\"Lumayan, tapi agak lengket di kulit. Mungkin cocok untuk kulit kering\",\"Moisturizer Y\",2026-06-02'\n  ].join(\"\\n\");\n  downloadFile(\"template_review.csv\", csv, \"text/csv\");\n  toast(\"Template CSV diunduh\");\n});\n\nfunction downloadFile(name, content, type) {\n  const blob = new Blob([content], { type });\n  const a = document.createElement(\"a\");\n  a.href = URL.createObjectURL(blob);\n  a.download = name;\n  document.body.appendChild(a); a.click(); a.remove();\n}\n\nconst fileInput = document.getElementById(\"fileInput\");\ndocument.getElementById(\"btnUpload\").addEventListener(\"click\", () => fileInput.click());\nfileInput.addEventListener(\"change\", async (e) => {\n  const f = e.target.files[0]; if (!f) return;\n  const txt = await f.text();\n  const rows = parseCSV(txt);\n  if (!rows.length) return toast(\"File kosong atau format salah\");\n  const header = rows[0].map(s => s.trim().toLowerCase());\n  const col = (k) => header.indexOf(k);\n  const iU = col(\"username\"), iR = col(\"rating\"), iT = col(\"review_text\"), iP = col(\"product\"), iD = col(\"date\");\n  if (iU < 0 || iR < 0 || iT < 0) {\n    toast(\"Header wajib: username, rating, review_text\");\n    fileInput.value = \"\"; return;\n  }\n  let added = 0;\n  for (let i = 1; i < rows.length; i++) {\n    const r = rows[i]; if (!r || r.length === 1 && !r[0]) continue;\n    const username = (r[iU]||\"\").trim();\n    const rating   = parseInt((r[iR]||\"\").trim());\n    const text     = (r[iT]||\"\").trim();\n    if (!username || !text || !rating) continue;\n    reviews.unshift({\n      id: nextId++, username, rating, text,\n      product: iP>=0 ? (r[iP]||\"\").trim() : \"—\",\n      date:    iD>=0 ? (r[iD]||\"\").trim() : \"\",\n    });\n    added++;\n  }\n  toast(`${added} review ditambahkan dari CSV`);\n  fileInput.value = \"\";\n  render();\n});\n\nfunction parseCSV(text) {\n  const rows = []; let row = []; let cur = \"\"; let q = false;\n  for (let i = 0; i < text.length; i++) {\n    const c = text[i];\n    if (q) {\n      if (c === '\"' && text[i+1] === '\"') { cur += '\"'; i++; }\n      else if (c === '\"') { q = false; }\n      else { cur += c; }\n    } else {\n      if (c === '\"') q = true;\n      else if (c === \",\") { row.push(cur); cur = \"\"; }\n      else if (c === \"\\n\") { row.push(cur); rows.push(row); row = []; cur = \"\"; }\n      else if (c === \"\\r\") { /* skip */ }\n      else { cur += c; }\n    }\n  }\n  if (cur.length || row.length) { row.push(cur); rows.push(row); }\n  return rows;\n}\n\n/* ----------------- Filters + search ----------------- */\ndocument.querySelectorAll(\".filter-chip\").forEach(chip => {\n  chip.addEventListener(\"click\", () => {\n    currentFilter = chip.dataset.filter;\n    document.querySelectorAll(\".filter-chip\").forEach(c => {\n      c.classList.remove(\"bg-slate-900\",\"text-white\");\n      c.classList.add(\"text-slate-600\",\"hover:bg-slate-100\");\n    });\n    chip.classList.add(\"bg-slate-900\",\"text-white\");\n    chip.classList.remove(\"text-slate-600\",\"hover:bg-slate-100\");\n    render();\n  });\n});\ndocument.getElementById(\"search\").addEventListener(\"input\", (e) => { searchQ = e.target.value; render(); });\n\n/* ----------------- Sidebar batch select ----------------- */\ndocument.querySelectorAll(\".batch-item\").forEach(b => {\n  b.addEventListener(\"click\", () => {\n    document.querySelectorAll(\".batch-item\").forEach(x => {\n      x.classList.remove(\"border-blue-600\",\"bg-blue-50\",\"ring-2\",\"ring-blue-500/10\");\n      x.classList.add(\"border-transparent\");\n      x.querySelector(\"span.font-bold\")?.classList.remove(\"text-blue-600\");\n      x.querySelector(\"span.font-bold\")?.classList.add(\"text-slate-900\");\n    });\n    b.classList.add(\"border-blue-600\",\"bg-blue-50\",\"ring-2\",\"ring-blue-500/10\");\n    b.classList.remove(\"border-transparent\");\n    b.querySelector(\"span.font-bold\")?.classList.remove(\"text-slate-900\");\n    b.querySelector(\"span.font-bold\")?.classList.add(\"text-blue-600\");\n  });\n});\n\n/* ----------------- Toast ----------------- */\nlet toastTimer;\nfunction toast(msg) {\n  const t = document.getElementById(\"toast\");\n  t.textContent = msg; t.classList.remove(\"hidden\");\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => t.classList.add(\"hidden\"), 2200);\n}\n\nrender();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
